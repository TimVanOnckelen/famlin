name: Publish Docker image

# Reusable build/push of the backend image to ghcr.io. Called by
# release-please.yml when a release is cut (the `on: release` event does NOT
# fire for release-please's GITHUB_TOKEN-created release, so it's chained via
# workflow_call instead), and runnable on its own via workflow_dispatch to
# rebuild an image manually.
on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to derive semver tags from (e.g. v1.2.3). Omit to derive from the git ref.
        type: string
        required: false
    outputs:
      image:
        description: Image name without tag (ghcr.io/owner/repo, lowercase)
        value: ${{ jobs.merge.outputs.image }}
      digest:
        description: Digest of the pushed multi-arch manifest list (sha256:...)
        value: ${{ jobs.merge.outputs.digest }}
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Multi-arch (linux/amd64 + linux/arm64): each architecture builds natively on
# its own runner — no QEMU emulation, which would make the production stage's
# from-source `sharp` compile (see backend/Dockerfile) take many times longer —
# and pushes an untagged image by digest. The `merge` job then stitches those
# digests into one multi-arch manifest list under the real tags, so users keep
# pulling the same `ghcr.io/...:latest` and Docker picks their architecture.
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # ghcr.io image names must be lowercase; github.repository isn't.
      - id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          platform='${{ matrix.platform }}'
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only — the tags are applied to the manifest list in `merge`.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          # Context is the repo root: the image bundles the member-facing web
          # app (web/ + packages/api-client), which lives outside backend/ —
          # see backend/Dockerfile.
          context: .
          file: ./backend/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          # Per-platform cache scope, so the two runners don't evict each
          # other's layers.
          cache-from: type=gha,scope=${{ steps.image.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.image.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # When called with a tag_name, pin the semver tags to it; otherwise
      # (manual dispatch) derive {{version}}/{{major}}.{{minor}} from the ref.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name }}
            type=raw,value=latest

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        id: inspect
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
