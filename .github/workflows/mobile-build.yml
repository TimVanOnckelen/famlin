name: Mobile build

# Store builds are chained from release-please.yml via workflow_call — the
# `on: release` event does NOT fire for release-please's GITHUB_TOKEN-created
# release (GitHub suppresses workflow-triggered-workflow events), same as
# docker-publish.yml. `on: release` is kept only for releases created by
# hand (release-please's own drafts are skipped, see the job's `if`); workflow_dispatch runs a manual build without store submission
# unless the production profile is chosen with a release event.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to build (e.g. v1.2.3). Omit to build the calling ref.
        type: string
        required: false
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options: [all, ios, android]
      profile:
        description: EAS build profile (see mobile/eas.json)
        required: true
        default: preview
        type: choice
        options: [production, diagnostics, preview, development]

jobs:
  build:
    # release-please's Releases are drafts published by its own workflow,
    # which already chains this build — so a release-please draft published
    # by hand (after a failed run) must not trigger a second store build.
    # Its author is github-actions[bot]; a release created by hand isn't.
    if: ${{ github.event_name != 'release' || github.event.release.author.login != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When chained from release-please, build the released tag; empty
          # means the triggering ref (release tag / dispatched branch).
          ref: ${{ inputs.tag_name || '' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      # Last gate before the store build: a native dep whose version drifts
      # from expo/bundledNativeModules.json makes Expo mix precompiled and
      # source-built frameworks, which crashes at launch only in the released
      # binary (the worklets 0.10.2 / RNWorklets dyld incident). Fail the
      # release here rather than shipping it.
      - name: Check dependency versions match the Expo SDK
        working-directory: mobile
        run: npx expo install --check

      - uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Release builds go straight to the App Store / Play Store, which needs
      # store credentials on disk for `eas submit` (referenced via eas.json's
      # $ASC_API_KEY_PATH / $GOOGLE_SERVICE_ACCOUNT_KEY_PATH env-var fields).
      # A "release run" is either a published-release event or the
      # workflow_call chain from release-please — i.e. anything that isn't a
      # manual workflow_dispatch (a called workflow inherits the caller's
      # event_name, `push` here).
      - name: Write store submission credentials
        if: github.event_name != 'workflow_dispatch'
        working-directory: mobile
        run: |
          mkdir -p secrets
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 -d > secrets/AuthKey.p8
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_BASE64 }}" | base64 -d > secrets/google-play.json

      - name: Build (manual run)
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait

      - name: Build and submit to stores (release)
        if: github.event_name != 'workflow_dispatch'
        working-directory: mobile
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_PATH: secrets/AuthKey.p8
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: secrets/google-play.json
        run: |
          eas build \
            --platform all \
            --profile production \
            --non-interactive \
            --auto-submit

      # --auto-submit only uploads the iOS binary to App Store Connect; it
      # never creates the App Store version or submits it for review. This
      # waits for Apple to finish processing the upload, attaches it to the
      # version, fills an empty "What's New" text and submits it for review.
      #
      # `eas submit` above needs none of the ASC_* repo secrets (the app id is
      # in eas.json and EAS keeps its own copy of the API key), so they may be
      # missing. The binary is already in App Store Connect at this point, so
      # rather than failing the release, warn and leave review submission to
      # be done by hand. ASC_APP_ID falls back to eas.json's ascAppId.
      - name: Submit iOS build for App Store review
        if: github.event_name != 'workflow_dispatch'
        working-directory: mobile
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_PATH: secrets/AuthKey.p8
        run: |
          if [ -z "$ASC_APP_ID" ]; then
            ASC_APP_ID=$(node -p "require('./eas.json').submit.production.ios.ascAppId || ''")
            export ASC_APP_ID
          fi
          missing=""
          [ -n "$ASC_APP_ID" ] || missing="$missing ASC_APP_ID"
          [ -n "$ASC_API_KEY_ID" ] || missing="$missing ASC_API_KEY_ID"
          [ -n "$ASC_API_KEY_ISSUER_ID" ] || missing="$missing ASC_API_KEY_ISSUER_ID"
          [ -s "$ASC_API_KEY_PATH" ] || missing="$missing APP_STORE_CONNECT_API_KEY_BASE64"
          if [ -n "$missing" ]; then
            echo "::warning title=App Store review not submitted::Missing repository secret(s):$missing. The build was uploaded to App Store Connect; submit it for review by hand, or add the secrets to automate this."
            exit 0
          fi
          export APP_VERSION=$(node -p "require('./app.json').expo.version")
          export APP_BUILD_NUMBER=$(node -p "require('./app.json').expo.ios.buildNumber || require('./app.json').expo.version")
          node ../scripts/asc-submit-for-review.mjs

      - name: Clean up store credentials
        if: always() && github.event_name != 'workflow_dispatch'
        working-directory: mobile
        run: rm -rf secrets
