name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Empty token = diff against local .git history instead of calling the
          # GitHub API from Node. The checkout above already fetches every ref
          # (fetch-depth: 0), and the API path breaks on runners whose TLS is
          # intercepted ("self-signed certificate" since the Node 24 default).
          token: ''
          filters: |
            mobile:
              - 'mobile/**'
              - 'packages/api-client/**'
              - 'package.json'
              - 'package-lock.json'
            # Everything that ends up in (or starts) the Docker image the
            # end-to-end smoke tests drive. Docs/website/mobile-only PRs skip
            # them.
            e2e:
              - 'backend/**'
              - 'web/**'
              - 'packages/**'
              - 'e2e/**'
              - 'docker-compose.yml'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            backend/admin/package-lock.json
            mobile/package-lock.json
      # web + packages/api-client are root workspace members. This also
      # builds @famlin/api-client, which backend/admin's and mobile's
      # installs below need for their `file:` dependency — see the same
      # ordering note on the admin/mobile jobs further down.
      - name: Install workspace dependencies (builds @famlin/api-client)
        run: npm ci
      # One root Prettier config covers backend, admin, web, api-client and
      # mobile (see .prettierignore for what's excluded). Run `npm run format`
      # from the repo root to fix a failure here.
      - name: Check formatting (Prettier)
        run: npm run format:check
      - name: Lint shared API client
        working-directory: packages/api-client
        run: npm run lint
      - name: Lint web app
        working-directory: web
        run: npm run lint
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Lint backend
        working-directory: backend
        run: npm run lint
      - name: Install admin dependencies
        working-directory: backend/admin
        run: npm ci
      - name: Lint admin UI
        working-directory: backend/admin
        run: npm run lint
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Lint mobile app
        working-directory: mobile
        run: npm run lint
      # ubuntu-latest ships shellcheck; covers the installer served at famlin.app/install.sh.
      - name: Lint shell scripts (ShellCheck)
        run: shellcheck scripts/*.sh
      # Third-party actions run with this repo's tokens and secrets (GHCR
      # push, EAS, release-please). A mutable tag (`@v4`) can be repointed to
      # malicious code if the action's repo is compromised; a full commit SHA
      # can't. Dependabot/Renovate keep the pins and their `# vX.Y.Z`
      # comments current. Local reusable workflows (`./...`) are exempt.
      - name: Check GitHub Actions are pinned to a commit SHA
        run: |
          unpinned=$(grep -rnE '^\s*-?\s*uses:' .github/workflows \
            | grep -vE "uses:\s*['\"]?\./" \
            | grep -vE "uses:\s*['\"]?[^@[:space:]'\"]+@[0-9a-f]{40}['\"]?(\s|$)" \
            | grep -vE "uses:\s*['\"]?docker://[^@[:space:]'\"]+@sha256:[0-9a-f]{64}['\"]?(\s|$)" || true)
          if [ -n "$unpinned" ]; then
            echo "::error::Pin these actions to a full commit SHA (with a '# vX.Y.Z' comment), docker:// images to @sha256:"
            echo "$unpinned"
            exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: famlin
          POSTGRES_PASSWORD: famlin
          POSTGRES_DB: famlin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U famlin -d famlin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://famlin:famlin@localhost:5432/famlin_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Upload integration tests generate MOV fixtures and verify the
      # background H.264 conversion with ffmpeg and ffprobe. Live Photo
      # session matching also reads Apple identifiers with exiftool.
      - name: Install media processing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
          exiftool -ver
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Apply migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Test
        working-directory: backend
        run: npx vitest run --passWithNoTests

  storage-s3:
    name: Storage contracts and migration (MinIO)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: famlin
          POSTGRES_PASSWORD: famlin
          POSTGRES_DB: famlin_storage_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U famlin -d famlin_storage_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://famlin:famlin@localhost:5432/famlin_storage_test
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      UPLOADS_DIR: /tmp/famlin-storage-test-uploads
      BACKUPS_DIR: /tmp/famlin-storage-test-backups
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install media processing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl
      - name: Start isolated MinIO
        run: |
          docker run -d --name minio-test -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=famlin-test -e MINIO_ROOT_PASSWORD=famlin-test-secret pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs minio-test
          exit 1
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx vitest run tests/storage-local.test.ts tests/storage-s3.test.ts tests/storage-migration.test.ts tests/storage-app-s3.test.ts
        working-directory: backend

  admin:
    name: Admin UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/admin/package-lock.json
      # admin depends on @famlin/api-client via file:../../packages/api-client.
      # That package's own dependencies (axios, etc.) are only installed by
      # the root workspace install — see the same pattern in the mobile job
      # below — so it must run before admin's install, here and on any fresh
      # checkout.
      - name: Install workspace dependencies (builds @famlin/api-client)
        run: npm ci
      - name: Install dependencies
        working-directory: backend/admin
        run: npm ci
      - name: Typecheck
        working-directory: backend/admin
        run: npx tsc --noEmit
      - name: Build
        working-directory: backend/admin
        run: npm run build

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      # mobile depends on @famlin/api-client via file:../packages/api-client.
      # Its `prepare` (tsc) script needs the package's devDependencies, which
      # only the root workspace install provides — so the root install must
      # run before mobile's, here and on any fresh checkout.
      - name: Install workspace dependencies (builds @famlin/api-client)
        run: npm ci
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      # tsc/Jest/Metro all pass when a native module is only transitively
      # installed (npm auto-installs peer deps), but RN autolinking only links
      # native code for *direct* dependencies — the app then aborts at launch
      # with dyld "Library not loaded" (the RNWorklets/Reanimated 4 incident
      # this guards against).
      - name: Check native peer dependencies are direct
        working-directory: mobile
        run: node scripts/check-native-peer-deps.mjs
      # Expo SDK precompiles native frameworks (RNReanimated etc.) against the
      # exact versions in expo/bundledNativeModules.json. A manually bumped
      # native dep (e.g. react-native-worklets 0.10.2 vs the expected 0.10.0)
      # builds from source instead, producing mixed precompiled/source linkage
      # that only crashes at launch on real EAS/TestFlight builds — never in
      # dev, tsc, or Jest. `expo install --check` exits non-zero on any drift.
      - name: Check dependency versions match the Expo SDK
        working-directory: mobile
        run: npx expo install --check
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Test
        working-directory: mobile
        run: npm test
      # tsc/Jest both resolve modules more leniently than Metro does at EAS
      # build time (see the tslib/@famlin/api-client incident this guards
      # against) — `expo export` runs the same Metro bundling step EAS build
      # does (`expo export:embed`) without needing macOS/Xcode, so it catches
      # bundler-only resolution failures on every PR instead of only at
      # release time.
      - name: Verify Metro bundle (iOS)
        working-directory: mobile
        run: npx expo export --platform ios --output-dir /tmp/expo-export-ios
      - name: Verify Metro bundle (Android)
        working-directory: mobile
        run: npx expo export --platform android --output-dir /tmp/expo-export-android

  web:
    name: Web app & shared API client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck shared API client
        working-directory: packages/api-client
        run: npx tsc --noEmit
      - name: Test shared API client
        working-directory: packages/api-client
        run: npx vitest run
      - name: Typecheck web app
        working-directory: web
        run: npx tsc --noEmit
      - name: Test web app
        working-directory: web
        run: npx vitest run
      - name: Build web app
        run: npm run build --workspace=web

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Typecheck
        working-directory: docs
        run: npm run typecheck
      - name: Build
        working-directory: docs
        run: npm run build

  # Guardrail for unmarked breaking changes: when a PR changes the OpenAPI
  # spec in a way oasdiff classifies as breaking, at least one commit in the
  # PR (or the PR title, which becomes the commit on squash-merge) must be
  # marked in conventional-commit breaking form — `feat!:` / `fix(scope)!:`
  # or a `BREAKING CHANGE:` footer. That marker is what release-please turns
  # into the "⚠ BREAKING CHANGES" changelog section and version bump, and
  # what the release-notes rewrite uses to warn self-hosting admins — an
  # unmarked breaking change ships silently as a minor entry.
  docs-required:
    # Every new feature ships with documentation (see "Documentation" in
    # AGENTS.md and docs/developers/contributing.md). A PR whose title or any
    # commit is a conventional-commit `feat` must touch docs/ or website/,
    # unless a commit carries a `Docs-not-needed: <reason>` trailer, or the PR
    # description does.
    name: Documentation required for features
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a docs change for feat PRs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          FEAT='^feat(\([^)]*\))?!?:'
          if ! printf '%s\n' "$PR_TITLE" | grep -qE "$FEAT" \
             && ! git log --format='%s' "$BASE_SHA"..HEAD | grep -qE "$FEAT"; then
            echo "No feat commit or PR title — documentation not required."
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(docs|website)/'; then
            echo "Feature PR updates docs/ or website/ — OK."
            exit 0
          fi
          OPT_OUT='^Docs-not-needed: *[^ ]'
          if git log --format='%b' "$BASE_SHA"..HEAD | grep -qiE "$OPT_OUT" \
             || printf '%s\n' "$PR_BODY" | grep -qiE "$OPT_OUT"; then
            echo "Documentation explicitly marked as not needed — OK."
            exit 0
          fi
          echo "::error::This PR adds a feature (a 'feat' commit or PR title) but changes nothing under docs/ or website/. Document the feature (see the Documentation table in AGENTS.md), or, if it really has no user-, admin- or developer-visible behavior to document, add a 'Docs-not-needed: <reason>' line to a commit message or the PR description."
          exit 1

  api-breaking-changes:
    name: API breaking-change check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SPEC: docs/openapi/famlin.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare spec against base and require a breaking marker
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          if git diff --quiet "$BASE_SHA" HEAD -- "$SPEC"; then
            echo "OpenAPI spec unchanged — nothing to check."
            exit 0
          fi
          if ! git show "$BASE_SHA:$SPEC" > /tmp/base-spec.yaml 2>/dev/null; then
            echo "Spec does not exist on the base branch — nothing to compare against."
            exit 0
          fi
          mkdir -p /tmp/specs
          mv /tmp/base-spec.yaml /tmp/specs/base.yaml
          cp "$SPEC" /tmp/specs/head.yaml
          set +e
          OUTPUT=$(docker run --rm -v /tmp/specs:/specs:ro tufin/oasdiff \
            breaking /specs/base.yaml /specs/head.yaml --fail-on ERR 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "Spec changed, but no breaking API changes detected."
            exit 0
          fi
          echo "$OUTPUT"
          {
            echo "## ⚠️ Breaking API changes detected in \`$SPEC\`"
            echo '```'
            echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          MARKER='^[[:alnum:]]+(\([^)]*\))?!:|BREAKING[- ]CHANGE:'
          if git log --format='%s%n%b' "$BASE_SHA"..HEAD | grep -qE "$MARKER"; then
            echo "A commit in this PR is marked as breaking — OK."
            exit 0
          fi
          if printf '%s' "$PR_TITLE" | grep -qE "$MARKER"; then
            echo "The PR title is marked as breaking — OK."
            exit 0
          fi
          echo "::error::$SPEC has breaking API changes (see the job summary), but no commit or PR title carries a conventional-commit breaking marker. Mark it with a '!' after the type (e.g. 'feat!: ...') or add a 'BREAKING CHANGE: <what an admin must do when upgrading>' footer, so release-please surfaces it in the release's breaking-changes section."
          exit 1

  client-compat:
    # The other direction from api-breaking-changes: new mobile apps talk to
    # older self-hosted servers (support window: three minor versions back,
    # issue #378). Fails when @famlin/api-client calls an endpoint missing
    # from the OpenAPI spec of the oldest supported release, unless the call
    # carries a `// requires-feature: <id>` comment or is allowlisted in
    # scripts/client-compat-allowlist.json. See "Supporting older servers"
    # in docs/developers/contributing.md.
    name: Client vs oldest supported server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check reads docs/openapi/famlin.yaml at an old release tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Dependency-free script — no npm ci needed.
      - name: Check api-client calls against the oldest supported spec
        run: npm run check:client-compat

  dependency-review:
    # Diffs every lockfile in the repo (root workspace, backend/,
    # backend/admin/, mobile/, docs/) between the PR's base and head and
    # fails when a dependency the PR adds or bumps has a known vulnerability
    # of high severity or worse, or a license that isn't compatible with
    # Famlin's MIT license. The allow list and the reviewed per-package
    # exceptions live in .github/dependency-review-config.yml. Dependencies
    # the PR doesn't touch are not re-checked. The job summary also lists
    # each new package's OpenSSF Scorecard, and on failure the summary is
    # commented on the PR (except on Dependabot PRs, whose token is read-only).
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  docker:
    # Both architectures docker-publish.yml ships, each on a native runner —
    # a green amd64-only build says nothing about arm64.
    name: Docker build (${{ matrix.platform }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache-scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-scope: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Repo-root context: the image also bundles web/ + packages/ — see
          # backend/Dockerfile.
          context: .
          file: ./backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: famlin-ci:test
          # Same per-platform scopes as docker-publish.yml, so a release
          # build reuses the layers CI already built.
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
      # The native bits a build can't catch: sharp's from-source compile
      # against the system libvips (with HEIC decode) and ffmpeg must actually
      # load and run on this architecture.
      - name: Smoke-test native dependencies
        run: |
          docker run --rm famlin-ci:test node -e "
            const sharp = require('sharp');
            // The prebuilt (no-HEIC) sharp also reports heif input, but for .avif
            // only — the suffix list is what tells a real HEIC build apart.
            const suffixes = sharp.format.heif.input.fileSuffix || [];
            if (!suffixes.includes('.heic')) throw new Error('sharp lacks HEIC input support: ' + suffixes.join(','));
            console.log('sharp ok, libvips', sharp.versions.vips);
          "
          docker run --rm famlin-ci:test ffmpeg -hide_banner -version | head -1

      # End-to-end smoke tests (e2e/): the image just built, started with the
      # real zero-config docker-compose.yml, driven through its golden paths in
      # Chromium — setup, invite, join, photo post, reaction, comment, export.
      # amd64 only: the arm64 build is covered by the native smoke test above,
      # and running the same browser flows twice would only add minutes.
      - name: Start the stack for end-to-end tests
        id: e2e-stack
        if: matrix.platform == 'linux/amd64' && needs.changes.outputs.e2e == 'true'
        env:
          # docker-compose.yml runs ghcr.io/timvanonckelen/famlin:${FAMLIN_VERSION};
          # the local tag means Compose uses this build and never pulls.
          FAMLIN_VERSION: e2e
        run: |
          docker tag famlin-ci:test ghcr.io/timvanonckelen/famlin:e2e
          docker compose -p famlin-e2e -f docker-compose.yml up -d
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "healthy after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Famlin did not become healthy within 180s"
          docker compose -p famlin-e2e logs famlin-backend
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.e2e-stack.outcome == 'success'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Run end-to-end tests
        if: steps.e2e-stack.outcome == 'success'
        working-directory: e2e
        run: |
          npm ci
          npx tsc --noEmit
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Show server logs
        if: failure() && steps.e2e-stack.outcome == 'success'
        run: docker compose -p famlin-e2e logs --no-color famlin-backend | tail -n 300
      - name: Upload end-to-end report
        if: failure() && steps.e2e-stack.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
