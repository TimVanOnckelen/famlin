name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Concurrency is scoped per job below, NOT workflow-wide. A workflow-level
# group would queue entire runs behind the multi-hour mobile store build, and
# GitHub keeps only one pending run per group — so a push merged during a
# build could be superseded entirely, leaving the release PR (and its version
# bump) stale until the next push to main.

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Serialize the release step itself so two rapid pushes can't race the
    # release PR. This job finishes in seconds, so queuing here is harmless.
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please creates the GitHub Release using the default GITHUB_TOKEN,
  # which does NOT trigger docker-publish.yml's `on: release` event (GitHub
  # suppresses workflow-triggered-workflow events to prevent recursion). So
  # the image build is chained here instead, in the same run, gated on
  # whether a release actually was created this time. The build itself lives
  # in docker-publish.yml (reused here so there's one source of truth).
  publish-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # Serialize image pushes so two releases can't interleave writes to the
    # rolling `latest` tag. Don't cancel in-flight pushes — a partial image
    # push is worse than waiting.
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  # Every release bumps mobile/package.json's `version` and mobile/app.json's
  # `version`/`buildNumber` via release-please's extra-files config (single
  # monorepo version), so those two files always show as "changed" between
  # tags even when no real mobile code changed. This job diffs against the
  # previous tag and ignores changes to just those version/buildNumber
  # fields, so a backend- or web-only release doesn't trigger a real EAS
  # store build + submission.
  mobile-changed:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for meaningful mobile changes since the previous release
        id: check
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found — building mobile to be safe."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$PREV_TAG" HEAD -- mobile packages/api-client)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No files under mobile/ or packages/api-client/ changed since $PREV_TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MEANINGFUL=false
          while IFS= read -r f; do
            case "$f" in
              mobile/package.json|mobile/app.json)
                REST=$(git diff "$PREV_TAG" HEAD -- "$f" \
                  | grep -E '^[+-]' \
                  | grep -v -E '^(\+\+\+|---)' \
                  | grep -v -E '"(version|buildNumber)":' || true)
                if [ -n "$REST" ]; then
                  echo "$f changed beyond version/buildNumber — meaningful."
                  MEANINGFUL=true
                fi
                ;;
              *)
                echo "$f changed — meaningful."
                MEANINGFUL=true
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "changed=$MEANINGFUL" >> "$GITHUB_OUTPUT"

  # Same GITHUB_TOKEN suppression applies to mobile-build.yml's `on: release`
  # trigger, so the store build+submit is chained here too. `secrets: inherit`
  # passes the EXPO/App Store/Play Store secrets the build needs. Gated on
  # mobile-changed so a release with no meaningful mobile change doesn't
  # trigger a real store submission.
  build-mobile:
    needs: [release-please, mobile-changed]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.mobile-changed.outputs.changed == 'true' }}
    # One store build at a time. If a newer release queues while an older
    # build is still pending, the older pending one is superseded — the
    # newest version is what should reach the stores anyway.
    concurrency:
      group: mobile-store-build
      cancel-in-progress: false
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/mobile-build.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  # Rewrite the GitHub Release body into human-readable notes (highlights +
  # breaking changes) using GitHub Models — authenticated by the workflow's
  # own GITHUB_TOKEN via the `models: read` permission, no extra secrets.
  # Only the Release body is touched; CHANGELOG.md stays release-please's.
  # Best-effort: if the model call fails, the release keeps the standard
  # auto-generated notes and the run still succeeds.
  enhance-release-notes:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
    steps:
      - name: Fetch generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release view "$TAG_NAME" -R "$GITHUB_REPOSITORY" \
            --json body --jq .body > release-notes.md
          {
            echo "Rewrite these auto-generated release notes for Famlin $TAG_NAME:"
            echo
            cat release-notes.md
          } > prompt.md

      - name: Generate human-readable notes
        id: ai
        continue-on-error: true
        uses: actions/ai-inference@v3
        with:
          prompt-file: prompt.md
          max-completion-tokens: '1500'
          system-prompt: >-
            You rewrite auto-generated conventional-commit release notes for
            Famlin, a self-hosted family updates app. The audience is
            self-hosting admins and the families using the app. Produce
            concise GitHub-flavored markdown: a 1-3 sentence summary of the
            release, then a "### ✨ Highlights" list describing user-facing
            features and fixes in plain language, and a
            "### ⚠️ Breaking changes" section ONLY if the input contains
            breaking changes, stating what an admin must do when upgrading.
            Skip internal chores, refactors, and dependency bumps unless they
            affect operators. Preserve any PR/issue links like (#123) on the
            items you keep. Output raw markdown only — no code fences, and do
            not repeat the version heading.

      - name: Update release notes
        if: steps.ai.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
        run: |
          {
            cat "$RESPONSE_FILE"
            echo
            echo "---"
            echo
            echo "<details><summary>Full changelog (auto-generated)</summary>"
            echo
            cat release-notes.md
            echo
            echo "</details>"
          } > final-notes.md
          gh release edit "$TAG_NAME" -R "$GITHUB_REPOSITORY" --notes-file final-notes.md

  # The release-please Release only carries the auto-generated source
  # archives. Make it a real download page: attach a docker-compose.yml pinned
  # to this exact version (+ .env.example), and append a "Downloads" section
  # with the multi-arch image's pull command/digest and the mobile apps.
  # Runs after enhance-release-notes because that job overwrites the whole
  # body, and after publish-docker so the image is only advertised once it
  # actually exists. `always()` keeps it running when the best-effort notes
  # rewrite was skipped or failed.
  release-assets:
    needs: [release-please, publish-docker, mobile-changed, enhance-release-notes]
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' && needs.publish-docker.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Attach version-pinned compose files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          mkdir -p assets
          # Same file as the repo root, but defaulting to this release
          # instead of the rolling `latest` tag (FAMLIN_VERSION still wins).
          sed "s/\${FAMLIN_VERSION:-latest}/\${FAMLIN_VERSION:-$VERSION}/" docker-compose.yml > assets/docker-compose.yml
          grep -q "FAMLIN_VERSION:-$VERSION}" assets/docker-compose.yml
          # No leading dot: GitHub renames dotfile assets to default.<name>.
          cp .env.example assets/env.example
          gh release upload "$TAG_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            assets/docker-compose.yml assets/env.example

      - name: Append downloads section to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          IMAGE: ${{ needs.publish-docker.outputs.image }}
          DIGEST: ${{ needs.publish-docker.outputs.digest }}
          MOBILE_CHANGED: ${{ needs.mobile-changed.outputs.changed }}
        run: |
          VERSION="${TAG_NAME#v}"
          MARKER='<!-- famlin-release-downloads -->'
          # Strip a previous run's section so a re-run doesn't duplicate it.
          gh release view "$TAG_NAME" -R "$GITHUB_REPOSITORY" --json body --jq .body \
            | sed "/^$MARKER\$/,\$d" \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          {
            echo
            echo "$MARKER"
            echo "## 📦 Downloads"
            echo
            echo "### Server (Docker)"
            echo
            echo "Multi-arch image for \`linux/amd64\` and \`linux/arm64\` (Raspberry Pi 4/5, ARM NAS, Apple Silicon, ARM cloud VMs) — Docker picks the right one automatically."
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            if [ -n "$DIGEST" ]; then
              echo "Digest: \`$DIGEST\`"
              echo
            fi
            echo "Upgrading an existing install: set \`FAMLIN_VERSION=$VERSION\` in your \`.env\` (or stay on \`latest\`), then \`docker compose pull && docker compose up -d\`. New install: download the \`docker-compose.yml\` (pinned to $VERSION) and \`env.example\` (save it as \`.env\`) attached below, and follow the [server setup guide](https://famlin.app/docs/server-setup)."
            echo
            echo "### Mobile apps"
            echo
            echo "- [App Store (iOS)](https://apps.apple.com/us/app/famlin/id6786783660)"
            echo "- [Google Play (Android)](https://play.google.com/store/apps/details?id=be.xeweb.famlin)"
            echo
            if [ "$MOBILE_CHANGED" = "true" ]; then
              echo "This release includes a new app version; it reaches the stores once store review completes."
            else
              echo "No app changes in this release — the current store version works with this server."
            fi
          } >> notes.md
          gh release edit "$TAG_NAME" -R "$GITHUB_REPOSITORY" --notes-file notes.md
