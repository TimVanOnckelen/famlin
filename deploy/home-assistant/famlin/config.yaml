name: Famlin
version: "0.8.7"
slug: famlin
description: Private, self-hosted family updates with photos, stories and milestones
url: https://famlin.app
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# The add-on runs its own init (run.sh); the base image has no s6-overlay.
init: false
# Not behind HA ingress: the phone apps and members' browsers need a normal
# external URL to the server. See DOCS.md.
ingress: false
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Famlin web app, admin page (/admin) and API
webui: http://[HOST]:[PORT:3000]/admin
# Everything (database, photos, backups, secrets) lives in the add-on's /data,
# so Home Assistant backups contain it all. "cold" stops the add-on while a
# backup runs so the database files are consistent.
backup: cold
options:
  trust_proxy: false
schema:
  trust_proxy: bool
